name: Deploy Agent Fragility Scanner

on:
  push:
      branches:
            - main  # Set this to your default branch name

            jobs:
              build-and-deploy:
                  runs-on: ubuntu-latest
                      steps:
                            - name: Checkout Repository
                                    uses: actions/checkout@v4

                                          - name: Setup Node.js
                                                  uses: actions/setup-node@v4
                                                          with:
                                                                    node-version: 18
                                                                              cache: 'npm'

                                                                                    - name: Install Dependencies
                                                                                            run: npm install

                                                                                                  - name: Build Production Bundle
                                                                                                          # This line injects your GitHub Secret into the build environment
                                                                                                                  run: npm run build
                                                                                                                          env:
                                                                                                                                    REACT_APP_FIREBASE_CONFIG: ${{ secrets.REACT_APP_FIREBASE_CONFIG }}

                                                                                                                                          - name: Deploy to GitHub Pages
                                                                                                                                                  uses: peaceiris/actions-gh-pages@v3
                                                                                                                                                          with:
                                                                                                                                                                    github_token: ${{ secrets.GITHUB_TOKEN }}
                                                                                                                                                                              publish_dir: ./dist # Use ./dist if you are using Vite
                                                                                                                                                                              
